events {}

http {
    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # El navegador solicita /api/health y /api/predict-batch.
        # La barra final en proxy_pass elimina el prefijo /api/.
        location /api/ {
            proxy_pass http://coordinator:9000/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 10s;
            proxy_read_timeout 180s;
        }

        # Compatibilidad con los comandos curl originales del repositorio.
        location = /health {
            proxy_pass http://coordinator:9000/health;
        }
        location = /predict-batch {
            proxy_pass http://coordinator:9000/predict-batch;
            proxy_read_timeout 180s;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
