events {}

http {
    # Necesario: sin mime.types, los .css se sirven como text/plain
    # y el navegador puede rechazarlos.
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # Las peticiones del frontend pasan al coordinador Go.
        # La barra final de proxy_pass elimina /api/ del prefijo.
        location /api/ {
            proxy_pass http://coordinator:9000/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 10s;
            proxy_read_timeout 180s;
        }

        # Compatibilidad con los comandos curl originales del repositorio.
        location = /health {
            proxy_pass http://coordinator:9000/health;
        }

        location = /predict-batch {
            proxy_pass http://coordinator:9000/predict-batch;
            proxy_read_timeout 180s;
        }

        # Si falta un recurso estático, devolver 404 en vez de index.html.
        location ~* \.(css|js|mjs|png|jpg|jpeg|svg|ico|webp)$ {
            try_files $uri =404;
        }

        # HTML principal (con posibilidad de añadir rutas del frontend).
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
