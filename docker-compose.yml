services:

  worker-1:
    build: .
    environment:
      WORKER_NAME: worker-1
      DATABASE_URL: "host=go_db user=postgres password=postgres dbname=postgres sslmode=disable"
    depends_on:
      go_db:
        condition: service_healthy

  worker-2:
    build: .
    environment:
      WORKER_NAME: worker-2
      DATABASE_URL: "host=go_db user=postgres password=postgres dbname=postgres sslmode=disable"
    depends_on:
      go_db:
        condition: service_healthy

  worker-3:
    build: .
    environment:
      WORKER_NAME: worker-3
      DATABASE_URL: "host=go_db user=postgres password=postgres dbname=postgres sslmode=disable"
    depends_on:
      go_db:
        condition: service_healthy

  load-balancer:
    build:
      context: ./load-balancer

    environment:
      BACKEND_URLS: "http://worker-1:8080,http://worker-2:8080,http://worker-3:8080"

    depends_on:
      - worker-1
      - worker-2
      - worker-3

  go_db:
    image: postgres:12

    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres

    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./insert.sql:/docker-entrypoint-initdb.d/02-insert.sql:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U postgres"
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:alpine
    ports:
    - "8080:80"
    volumes:
    - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
    - load-balancer

volumes:
  pgdata: